<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Night</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    /* Nền tối gần đen: gradient lạnh chảy rất chậm — đủ tối để ngủ,
       còn thoáng thấy màn hình bên dưới để kiểm tra agent */
    .night {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(120% 90% at 18% 8%, rgba(13, 20, 34, 0.6), transparent 62%),
        radial-gradient(110% 85% at 84% 92%, rgba(6, 16, 20, 0.55), transparent 58%),
        radial-gradient(90% 70% at 62% 42%, rgba(4, 10, 22, 0.5), transparent 72%),
        linear-gradient(165deg, rgba(2, 4, 9, 0.975) 0%, rgba(1, 3, 7, 0.995) 100%);
    }

    /* Blob mờ trôi cực chậm 80s — hầu như không nhận ra, không gây khó ngủ */
    .night::after {
      content: "";
      position: absolute;
      inset: -18%;
      background: radial-gradient(52% 42% at 50% 44%, rgba(10, 20, 33, 0.45), transparent 72%);
      animation: drift 80s ease-in-out infinite alternate;
      will-change: transform;
    }

    @keyframes drift {
      from { transform: translate3d(-2%, -1.2%, 0); }
      to { transform: translate3d(2%, 1.2%, 0); }
    }

    /* Hạt film grain phủ trên cùng — làm nền "mềm", không bị cảm giác khối đen phẳng */
    .grain {
      position: fixed;
      inset: 0;
      opacity: 0.05;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      background-size: 260px 260px;
    }

    @media (prefers-reduced-motion: reduce) {
      .night::after { animation: none; }
    }
  </style>
</head>
<body>
  <div class="night"><div class="grain"></div></div>
</body>
</html>
